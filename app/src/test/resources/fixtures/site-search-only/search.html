<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>搜索 - 脚本渲染站</title>
</head>
<body>
<div class="result">
    <div class="card"><a href="/comic/{{keyword}}"><img data-src="/img/{{keyword}}.jpg" alt="{{keyword}}"></a><p><a href="/comic/{{keyword}}">{{keyword}}</a></p></div>
    <div class="card"><a href="/comic/{{keyword}}-b"><img data-src="/img/{{keyword}}-b.jpg" alt="{{keyword}} 前传"></a><p><a href="/comic/{{keyword}}-b">{{keyword}} 前传</a></p></div>
    <div class="card"><a href="/comic/{{keyword}}-c"><img data-src="/img/{{keyword}}-c.jpg" alt="{{keyword}} 番外"></a><p><a href="/comic/{{keyword}}-c">{{keyword}} 番外</a></p></div>
</div>
</body>
</html>
