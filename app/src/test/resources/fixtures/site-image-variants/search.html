<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>搜索 - 多变体图片站</title>
</head>
<body>
    <header class="header"><nav class="nav"><a href="/">首页</a></nav></header>
    <div class="grid">
        <div class="item">
            <a class="thumb" href="/comic/{{keyword}}"><img class="p-1" srcset="/upload/cover/{{keyword}}.jpg 2x" alt="{{keyword}}"></a>
            <span class="name">{{keyword}}</span>
        </div>
    </div>
</body>
</html>
