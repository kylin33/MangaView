<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>搜索 - 无语义命名站</title>
</head>
<body>
    <header class="h-1"><nav class="v-1"><a href="/">首页</a></nav></header>
    <main>
        <h1 class="e-1">搜索：{{keyword}}</h1>
        <div class="g-1">
            <div class="i-9">
                <a class="l-2" href="/comic/{{keyword}}"><img class="p-3" data-lazy-src="/upload/cover/{{keyword}}.jpg" alt="{{keyword}}"></a>
                <span class="n-4">{{keyword}}</span>
            </div>
        </div>
    </main>
</body>
</html>
